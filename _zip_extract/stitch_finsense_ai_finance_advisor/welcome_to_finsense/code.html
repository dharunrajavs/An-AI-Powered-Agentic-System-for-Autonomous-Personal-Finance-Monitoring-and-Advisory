<script>
        const track = document.getElementById('carouselTrack');
        const nextBtn = document.getElementById('nextBtn');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;
        const totalSlides = 3;

        function updateCarousel() {
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update Dots
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.add('dot-active');
                } else {
                    dot.classList.remove('dot-active');
                }
            });

            // Update Button Text
            if (currentSlide === totalSlides - 1) {
                nextBtn.textContent = 'Get Started';
            } else {
                nextBtn.textContent = 'Continue';
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateCarousel();
            } else {
                // Final Action
                nextBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    alert('FinSense setup initiated! Redirecting to Dashboard...');
                    window.location.reload();
                }, 1000);
            }
        });

        // Add touch support for swiping
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        track.addEventListener('touchmove', e => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = startX - currentX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateCarousel();
                    isDragging = false;
                } else if (diff < 0 && currentSlide > 0) {
                    currentSlide--;
                    updateCarousel();
                    isDragging = false;
                }
            }
        });

        track.addEventListener('touchend', () => isDragging = false);
    </script>
