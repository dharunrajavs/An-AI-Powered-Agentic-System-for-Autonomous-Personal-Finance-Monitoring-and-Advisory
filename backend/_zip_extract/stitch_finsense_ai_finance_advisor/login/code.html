<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FinSense - Welcome Back</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary": "#005c55",

                        "on-secondary-fixed": "#002113",
                        "surface-container": "#e7eefe",
                        "secondary": "#006c49",

                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "container-max": "1280px",
                        "xl": "64px",
                        "xs": "8px",
                        "sm": "16px",
                        "gutter": "24px",
                        "md": "24px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],

                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],

<style>
        .glass-ai {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(121, 72, 227, 0.1);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 92, 85, 0.2);
            border-color: #005c55;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Auth Main Container -->
<main class="flex-grow flex items-center justify-center px-sm py-lg">
<div class="w-full max-w-md bg-surface-container-lowest p-md md:p-lg rounded-[32px] shadow-sm border border-outline-variant/30 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Branding & Header -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-md">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" data-icon="show_chart">show_chart</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-on-surface-variant">Sign in to continue</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email</label>
<div class="relative group input-focus-ring rounded-[16px] transition-all">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent rounded-[16px] focus:ring-0 focus:border-primary text-on-surface placeholder:text-outline/60 transition-all" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group input-focus-ring rounded-[16px] transition-all">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-low border-transparent rounded-[16px] focus:ring-0 focus:border-primary text-on-surface placeholder:text-outline/60 transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Primary Action -->
<div class="pt-sm space-y-md">
<button class="w-full py-4 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-lg hover:shadow-xl active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
<div class="flex flex-col items-center gap-xs">
<button class="w-14 h-14 rounded-full border border-outline-variant flex items-center justify-center hover:bg-surface-container-high transition-colors active:scale-90" type="button">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="fingerprint">fingerprint</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant">Biometric sign in</span>
</div>
</div>
</form>
<!-- Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="px-4 bg-surface-container-lowest text-on-surface-variant font-label-sm uppercase tracking-wider">or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-[16px] border border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-[16px] border border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4-6.7-5.81-5.45-14.7 1.05-15.02 1.55.05 2.51.98 3.41.98s2.05-1.12 3.86-.94c.78.05 3.01.32 4.45 2.4-3.55 2.1-2.98 6.64.44 8.04-1 2.38-2.25 4.54-3.83 4.54zM12.03 5.31c-.13-2.3 1.83-4.31 4.09-4.31.25 2.65-2.52 4.58-4.09 4.31z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Footer Signup -->
<div class="mt-xl text-center">
<p class="font-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-primary hover:underline transition-all" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Footer Meta -->
<footer class="py-md text-center">
<p class="font-label-sm text-outline-variant">© 2024 FinSense AI. Secured by institutional-grade encryption.</p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Add subtle hover effect for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>
</body></html>
